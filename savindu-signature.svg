<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mr+De+Haviland&amp;display=swap');
    
    .bg-plate {
      fill: #000000;
    }
    
    .apple-hello {
      font-family: 'Mr De Haviland', cursive;
      font-size: 150px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1800;
      stroke-dashoffset: 1800;
      animation: appleDraw 4s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }
    
    @keyframes appleDraw {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
  
  <rect width="100%" height="100%" class="bg-plate" rx="12" />

  <g transform="translate(0, 20)">
    <text x="500" y="160" text-anchor="middle" class="apple-hello">
      Savindu Geethma
    </text>
  </g>
</svg>
